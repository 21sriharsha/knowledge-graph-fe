<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knowledge Platform Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
/* Layout: one quiet reading column (Medium) beside an always-available graph surface (Obsidian).
   Chrome stays thin; the article column and the graph are the only things with presence. */
:root{
  --bg:#fafafa; --surface:#ffffff; --raised:#ffffff; --fg:#17191d; --muted:#5d6470; --faint:#8a919b;
  --line:#e8e9ec; --line-strong:#d3d6db; --accent:#2c56c9; --accent-fg:#ffffff; --accent-soft:#eaeffb;
  --code-bg:#f2f3f5; --mark:#fff1b8;
  --ok:#1d7448; --ok-soft:#e2f2e9; --warn:#8f5a00; --warn-soft:#fbefd6; --err:#b3261e; --err-soft:#fce8e6;
  --t-ds:#3567d6; --t-db:#0b8a78; --t-net:#c25e08; --t-obs:#8648cf; --t-sec:#c4365a; --t-dev:#5a861a;
  --edge:#cfd3d9; --edge-sug:#b9bec6;
  --serif:"Newsreader", "Iowan Old Style", Georgia, serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --read-size:20px; --read-lh:1.72; --col:680px; --hdr:56px;
  --shadow:0 1px 2px rgba(20,24,32,.05), 0 8px 24px rgba(20,24,32,.07);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111215; --surface:#16181c; --raised:#1c1f24; --fg:#e5e7ea; --muted:#a2a8b1; --faint:#737a84;
  --line:#25292f; --line-strong:#353a42; --accent:#86a5ff; --accent-fg:#0d1426; --accent-soft:#1a2440;
  --code-bg:#1b1e23; --mark:#4a3d0c;
  --ok:#55c48f; --ok-soft:#13281d; --warn:#e2a740; --warn-soft:#2b2111; --err:#ff8076; --err-soft:#341716;
  --t-ds:#7ea3ff; --t-db:#3fcab4; --t-net:#f0a35c; --t-obs:#b893f4; --t-sec:#f57f9b; --t-dev:#a0cc5f;
  --edge:#3a3f47; --edge-sug:#4a505a; --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#111215; --surface:#16181c; --raised:#1c1f24; --fg:#e5e7ea; --muted:#a2a8b1; --faint:#737a84;
  --line:#25292f; --line-strong:#353a42; --accent:#86a5ff; --accent-fg:#0d1426; --accent-soft:#1a2440;
  --code-bg:#1b1e23; --mark:#4a3d0c;
  --ok:#55c48f; --ok-soft:#13281d; --warn:#e2a740; --warn-soft:#2b2111; --err:#ff8076; --err-soft:#341716;
  --t-ds:#7ea3ff; --t-db:#3fcab4; --t-net:#f0a35c; --t-obs:#b893f4; --t-sec:#f57f9b; --t-dev:#a0cc5f;
  --edge:#3a3f47; --edge-sug:#4a505a; --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark; }
/* Reading mode: light theme only. Warmer paper, larger type, chrome recedes. */
:root[data-reading="on"]{
  --bg:#f4efe5; --surface:#f4efe5; --raised:#faf6ee; --fg:#2b261f; --muted:#6c6357; --faint:#958b7d;
  --line:#e2d9c9; --line-strong:#d2c6b2; --code-bg:#ebe3d4; --accent:#7a4b17; --accent-soft:#efe4d1;
  --read-size:22px; --read-lh:1.8; --col:640px; color-scheme:light; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg); color:var(--fg); font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; transition:background-color .25s ease, color .25s ease}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:60; background:var(--bg)}
a{color:inherit}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.gutter{padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}

/* ---------- Header ---------- */
.hdr{position:sticky; top:env(safe-area-inset-top,0px); z-index:50; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line)}
.hdr-in{height:var(--hdr); display:flex; align-items:center; gap:14px; max-width:1240px; margin:0 auto}
.brand{display:flex; align-items:center; gap:9px; text-decoration:none; font-family:var(--serif); font-size:21px; font-weight:600; letter-spacing:-.01em; flex:none}
.brand svg{width:22px; height:22px}
.nav{display:flex; gap:2px}
.nav a{text-decoration:none; color:var(--muted); padding:6px 10px; border-radius:7px; font-size:14px}
.nav a:hover{color:var(--fg); background:var(--code-bg)}
.nav a[aria-current="page"]{color:var(--fg); font-weight:500}
.search{position:relative; flex:1; max-width:380px; margin-left:auto}
.search input{width:100%; height:36px; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:0 14px 0 36px; font-size:14px}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute; left:12px; top:10px; width:16px; height:16px; color:var(--faint)}
.search kbd{position:absolute; right:10px; top:8px; font-family:var(--mono); font-size:11px; color:var(--faint); border:1px solid var(--line); border-radius:4px; padding:1px 5px}
.suggest{position:absolute; top:42px; left:0; right:0; background:var(--raised); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:6px; z-index:70}
.suggest button{display:flex; width:100%; text-align:left; gap:10px; align-items:baseline; border:0; background:none; padding:8px 10px; border-radius:8px; cursor:pointer}
.suggest button[aria-selected="true"], .suggest button:hover{background:var(--code-bg)}
.suggest .s-t{font-weight:500; flex:1; min-width:0}
.suggest .s-m{font-size:12px; color:var(--faint); white-space:nowrap}
.suggest .s-all{color:var(--accent); font-size:13px}
.hdr-actions{display:flex; align-items:center; gap:4px; flex:none}
.icon-btn{width:36px; height:36px; display:grid; place-items:center; border:0; background:none; border-radius:9px; cursor:pointer; color:var(--muted)}
.icon-btn:hover{background:var(--code-bg); color:var(--fg)}
.icon-btn svg{width:18px; height:18px}
.icon-btn[aria-pressed="true"]{color:var(--accent); background:var(--accent-soft)}
.btn{display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 14px; border-radius:999px; border:1px solid var(--line-strong); background:var(--surface); cursor:pointer; font-size:14px; font-weight:500; text-decoration:none; white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.btn.primary:hover{opacity:.88}
.btn.danger{color:var(--err); border-color:color-mix(in srgb, var(--err) 40%, transparent)}
.btn.ghost{border-color:transparent; background:none}
.btn.ghost:hover{background:var(--code-bg)}
.btn.sm{height:28px; padding:0 11px; font-size:13px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.avatar{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:600; color:#fff; flex:none; letter-spacing:.02em}
.avatar.lg{width:56px; height:56px; font-size:19px}
.menu{position:absolute; right:0; top:44px; min-width:220px; background:var(--raised); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:6px; z-index:70}
.menu .m-head{padding:8px 10px 10px; border-bottom:1px solid var(--line); margin-bottom:6px}
.menu a, .menu button{display:block; width:100%; text-align:left; padding:8px 10px; border:0; background:none; border-radius:8px; text-decoration:none; font-size:14px; cursor:pointer}
.menu a:hover, .menu button:hover{background:var(--code-bg)}

/* ---------- Generic ---------- */
main{min-height:calc(100% - var(--hdr))}
.wrap{max-width:1240px; margin:0 auto}
.eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:500}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.chip{display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 10px; border-radius:999px; background:var(--code-bg); font-size:12.5px; text-decoration:none; color:var(--muted); white-space:nowrap; border:0}
a.chip:hover, button.chip:hover{color:var(--fg)}
.dot{width:8px; height:8px; border-radius:50%; flex:none; display:inline-block}
.pill{display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 9px; border-radius:6px; font-size:12px; font-weight:500; white-space:nowrap}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
.pill.ok{background:var(--ok-soft); color:var(--ok)} .pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.err{background:var(--err-soft); color:var(--err)} .pill.neutral{background:var(--code-bg); color:var(--muted)}
.pill.info{background:var(--accent-soft); color:var(--accent)}
.skel{background:linear-gradient(90deg, var(--code-bg) 0%, color-mix(in srgb, var(--code-bg) 50%, var(--bg)) 50%, var(--code-bg) 100%); background-size:200% 100%; animation:sh 1.2s infinite linear; border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){ .skel{animation:none} *{transition:none!important; scroll-behavior:auto!important} }
.state{max-width:520px; margin:72px auto; text-align:center; display:grid; gap:12px; justify-items:center}
.state h2{font-family:var(--serif); font-size:28px; font-weight:500; margin:0; text-wrap:balance}
.state p{margin:0; color:var(--muted)}
.state .code{font-family:var(--mono); font-size:12px; color:var(--faint)}
.tabular{font-variant-numeric:tabular-nums}

/* ---------- Home ---------- */
.home{display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:56px; padding-block:28px 64px}
.hero-graph{grid-column:1/-1; border:1px solid var(--line); border-radius:16px; background:var(--surface); position:relative; overflow:hidden}
.hero-graph .hg-copy{position:absolute; left:24px; top:20px; z-index:2; max-width:360px; pointer-events:none}
.hero-graph h1{font-family:var(--serif); font-weight:500; font-size:30px; line-height:1.15; margin:6px 0 6px; letter-spacing:-.01em; text-wrap:balance}
.hero-graph p{margin:0; color:var(--muted)}
.hero-graph .hg-cta{position:absolute; right:16px; bottom:16px; z-index:2}
.hero-graph .gcanvas{height:300px; cursor:pointer}
.feed-head{font-size:13px; font-weight:500; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; padding:10px 0; border-bottom:1px solid var(--line)}
.feed-tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:8px; overflow-x:auto; scrollbar-width:none}
.feed-tabs::-webkit-scrollbar{display:none}
.feed-tabs button{border:0; background:none; padding:10px 12px; font-size:14px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap}
.feed-tabs button[aria-selected="true"]{color:var(--fg); border-color:var(--fg)}
.post{display:grid; gap:6px; padding:22px 0; border-bottom:1px solid var(--line)}
.post-by{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
.post-by .avatar{width:22px; height:22px; font-size:10px}
.post h2{font-family:var(--serif); font-size:23px; line-height:1.25; font-weight:600; margin:2px 0 0; letter-spacing:-.005em; text-wrap:balance}
.post h2 a{text-decoration:none}
.post h2 a:hover{text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px}
.post p{margin:0; color:var(--muted); font-family:var(--serif); font-size:17px; line-height:1.5}
.post-meta{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; color:var(--faint); margin-top:4px}
.links-badge{display:inline-flex; align-items:center; gap:5px}
.links-badge svg{width:14px; height:14px}
.rail{display:grid; gap:36px; align-content:start; position:sticky; top:calc(var(--hdr) + 24px)}
.rail h3{font-size:13px; font-weight:600; margin:0 0 12px; letter-spacing:.01em}
.trend{list-style:none; margin:0; padding:0; display:grid; gap:14px; counter-reset:t}
.trend li{display:grid; grid-template-columns:28px 1fr; gap:6px; counter-increment:t}
.trend li::before{content:counter(t, decimal-leading-zero); font-family:var(--serif); font-size:20px; color:var(--line-strong); line-height:1.1}
.trend a{text-decoration:none; font-weight:500; line-height:1.3; display:block}
.trend a:hover{text-decoration:underline}
.trend .tm{font-size:12px; color:var(--faint)}
.trend-tax{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px}
.trend-tax .chip{font-size:11px; padding:2px 7px}
.topic-list{display:flex; flex-wrap:wrap; gap:8px}
.more{display:flex; justify-content:center; padding-top:24px}

/* ---------- Article ---------- */
.article-shell{display:grid; grid-template-columns:220px minmax(0, var(--col)) 280px; gap:48px; justify-content:center; padding-block:40px 80px}
.toc{position:sticky; top:calc(var(--hdr) + 32px); align-self:start; font-size:13px}
.toc ol{list-style:none; margin:10px 0 0; padding:0; display:grid; gap:2px; border-left:1px solid var(--line)}
.toc a{display:block; padding:4px 0 4px 12px; margin-left:-1px; border-left:2px solid transparent; text-decoration:none; color:var(--faint); line-height:1.35}
.toc a.l3{padding-left:24px}
.toc a:hover{color:var(--fg)}
.toc a.active{color:var(--fg); border-color:var(--fg)}
.side{position:sticky; top:calc(var(--hdr) + 32px); align-self:start; display:grid; gap:12px}
.lg-card{border:1px solid var(--line); border-radius:14px; background:var(--surface); overflow:hidden}
.lg-head{display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-bottom:1px solid var(--line); gap:8px}
.lg-head .eyebrow{font-size:11px}
.lg-tools{display:flex; gap:4px; align-items:center}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.seg button{border:0; background:none; padding:3px 9px; font-size:12px; cursor:pointer; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg); color:var(--bg)}
.lg-card .gcanvas{height:260px}
.lg-foot{display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-top:1px solid var(--line); font-size:12px; color:var(--faint)}
.toggle{display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; user-select:none}
.toggle input{appearance:none; width:30px; height:18px; border-radius:999px; background:var(--line-strong); position:relative; cursor:pointer; transition:background .15s; flex:none; margin:0}
.toggle input::after{content:""; position:absolute; width:14px; height:14px; border-radius:50%; background:#fff; top:2px; left:2px; transition:left .15s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{left:14px}
.toggle.sm{font-size:12px}
article.doc header{display:grid; gap:14px; margin-bottom:36px}
.crumbs{display:flex; gap:6px; font-size:13px; color:var(--faint); flex-wrap:wrap}
.crumbs a{text-decoration:none} .crumbs a:hover{color:var(--fg)}
article.doc h1{font-family:var(--serif); font-size:clamp(32px, 5vw, 44px); line-height:1.12; letter-spacing:-.015em; font-weight:600; margin:0; text-wrap:balance}
.dek{font-family:var(--serif); font-size:22px; line-height:1.4; color:var(--muted); margin:0; text-wrap:pretty}
.byline{display:flex; align-items:center; gap:12px; padding-block:14px; border-block:1px solid var(--line); font-size:14px}
.byline a{text-decoration:none; font-weight:500}
.byline .bm{color:var(--faint); font-size:13px}
.byline .acts{margin-left:auto; display:flex; gap:2px}
.prose{font-family:var(--serif); font-size:var(--read-size); line-height:var(--read-lh); color:var(--fg)}
.prose > *{margin:0 0 1.15em}
.prose h2{font-family:var(--sans); font-size:24px; line-height:1.3; font-weight:600; letter-spacing:-.01em; margin:1.9em 0 .6em; scroll-margin-top:calc(var(--hdr) + 24px)}
.prose h3{font-family:var(--sans); font-size:19px; font-weight:600; margin:1.6em 0 .5em; scroll-margin-top:calc(var(--hdr) + 24px)}
.prose code{font-family:var(--mono); font-size:.8em; background:var(--code-bg); padding:.12em .38em; border-radius:4px}
.prose pre{position:relative; background:var(--code-bg); border-radius:10px; padding:38px 18px 16px; overflow-x:auto; font-size:14px; line-height:1.6; margin:1.5em 0}
.prose pre code{background:none; padding:0; font-size:inherit}
.prose pre .lang{position:absolute; top:8px; right:10px; font-family:var(--mono); font-size:11px; color:var(--faint); display:flex; gap:8px; align-items:center}
.prose pre .lang button{font-family:var(--sans); font-size:11px; border:1px solid var(--line-strong); background:var(--surface); border-radius:5px; padding:1px 7px; cursor:pointer; color:var(--muted)}
.prose blockquote{border-left:3px solid var(--fg); margin-left:0; padding-left:20px; font-style:italic; color:var(--muted)}
.prose blockquote > *{margin:0 0 .6em}
.prose ul, .prose ol{padding-left:1.3em}
.prose li{margin:.3em 0} .prose li > p{margin:0}
.prose hr{border:0; text-align:center; margin:2.4em 0}
.prose hr::after{content:"· · ·"; letter-spacing:.6em; color:var(--faint)}
.table-wrap{overflow-x:auto; margin:1.5em 0}
.prose table{border-collapse:collapse; font-family:var(--sans); font-size:14px; line-height:1.45; width:100%; min-width:420px}
.prose th, .prose td{border-bottom:1px solid var(--line); padding:9px 12px; text-align:left; vertical-align:top}
.prose th{font-weight:600; border-bottom-color:var(--line-strong)}
.prose a.ext{text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px}
a.ilink{text-decoration:none; color:var(--accent); background:linear-gradient(var(--accent-soft), var(--accent-soft)) no-repeat 0 100%/100% .35em; transition:background-size .15s}
a.ilink:hover{background-size:100% 100%}
.ilink.unresolved{color:var(--muted); border-bottom:1px dashed var(--faint); cursor:help}
.after{display:grid; gap:28px; margin-top:48px; padding-top:28px; border-top:1px solid var(--line)}
.after h3{font-size:13px; font-weight:600; margin:0 0 12px}
.ref-list{display:grid; gap:10px}
.ref{display:block; text-decoration:none; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
.ref:hover{border-color:var(--line-strong)}
.ref b{display:block; font-weight:500} .ref span{font-size:13px; color:var(--muted)}
.unwritten{display:flex; flex-wrap:wrap; gap:8px}
.unwritten span{font-size:13px; border:1px dashed var(--line-strong); border-radius:999px; padding:3px 11px; color:var(--muted)}
.pn{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.pn a{display:grid; gap:2px; padding:14px; border:1px solid var(--line); border-radius:10px; text-decoration:none}
.pn a:hover{border-color:var(--line-strong)}
.pn a.next{text-align:right}
.pn small{color:var(--faint); font-size:12px}
.preview{position:fixed; z-index:80; width:340px; max-width:calc(100vw - 32px); background:var(--raised); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:16px; font-size:14px; pointer-events:none}
.preview b{font-family:var(--serif); font-size:18px; display:block; line-height:1.25; margin-bottom:6px}
.preview p{margin:0 0 8px; color:var(--muted); line-height:1.45}
.preview small{color:var(--faint)}
.exit-reading{position:fixed; right:max(20px, env(safe-area-inset-right,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:40}
.progress{position:fixed; left:0; top:env(safe-area-inset-top,0px); height:2px; background:var(--accent); z-index:61; width:0}

/* Reading mode chrome */
:root[data-reading="on"][data-view="article"] .nav, :root[data-reading="on"][data-view="article"] .search{display:none}
:root[data-reading="on"][data-view="article"] .hdr{background:var(--bg); border-color:transparent}
:root[data-reading="on"] .article-shell{grid-template-columns:minmax(0, var(--col))}
:root[data-reading="on"] .toc, :root[data-reading="on"] .side{display:none}
:root[data-reading="on"] .proto-fab{opacity:.5}

/* ---------- Search ---------- */
.search-page{max-width:760px; margin:0 auto; padding-block:36px 72px}
.sp-box{display:flex; gap:10px; align-items:center}
.sp-box input{flex:1; height:48px; font-family:var(--serif); font-size:22px; border:0; border-bottom:2px solid var(--fg); background:none; padding:0 2px; border-radius:0}

.interp{margin-top:22px; padding:14px 16px; border-radius:12px; background:var(--accent-soft); display:grid; gap:8px}
.interp.off{background:var(--code-bg)}
.interp-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:13px}
.interp-row .k{color:var(--muted)}
.interp .chip{background:var(--surface)}
.hits{margin-top:8px}
.hit{padding:20px 0; border-bottom:1px solid var(--line); display:grid; gap:6px}
.hit h3{margin:0; font-family:var(--serif); font-size:21px; font-weight:600; line-height:1.3}
.hit h3 a{text-decoration:none} .hit h3 a:hover{text-decoration:underline}
.hit p{margin:0; color:var(--muted); font-family:var(--serif); font-size:16.5px}
.hit mark{background:var(--mark); color:inherit; border-radius:2px; padding:0 1px}
.why{font-size:13px}

.why-grid{display:grid; grid-template-columns:110px 1fr 44px; gap:6px 10px; align-items:center; margin-top:10px; max-width:420px}
.bar{height:6px; border-radius:3px; background:var(--code-bg); overflow:hidden}

/* ---------- Graph explorer ---------- */
.explorer{position:relative; height:calc(100dvh - var(--hdr) - env(safe-area-inset-top,0px)); min-height:520px; overflow:hidden; background:var(--bg)}
.explorer .gcanvas{position:absolute; inset:0}
.gpanel{position:absolute; left:max(16px, env(safe-area-inset-left,0px)); top:16px; width:280px; max-height:calc(100% - 32px); overflow:auto; background:var(--raised); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); z-index:5}
.gpanel section{padding:14px 16px; border-bottom:1px solid var(--line); display:grid; gap:10px}
.gpanel section:last-child{border-bottom:0}
.gpanel label.f{display:grid; gap:6px; font-size:13px; color:var(--muted)}
.gpanel input[type=text], .gpanel select{height:34px; border:1px solid var(--line); border-radius:8px; background:var(--surface); padding:0 10px; font-size:14px; width:100%}
.gpanel input[type=range]{width:100%; accent-color:var(--accent)}
.gp-head{display:flex; justify-content:space-between; align-items:center}
.gp-head h2{font-size:14px; margin:0; font-weight:600}
.topic-filter{display:grid; gap:4px}
.topic-filter label{display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; padding:3px 0}
.topic-filter input{accent-color:var(--accent); margin:0}
.topic-filter .n{margin-left:auto; color:var(--faint); font-size:12px}
.legend-edges{display:grid; gap:6px; font-size:12px; color:var(--muted)}
.legend-edges div{display:flex; align-items:center; gap:8px}
.legend-edges svg{width:34px; height:8px; flex:none}
.gbanner{position:absolute; top:16px; left:50%; transform:translateX(-50%); z-index:4; background:var(--raised); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:13px; color:var(--muted); box-shadow:var(--shadow); white-space:nowrap; max-width:calc(100% - 340px); overflow:hidden; text-overflow:ellipsis}
.gcard{position:absolute; right:max(16px, env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); width:320px; max-width:calc(100% - 32px); background:var(--raised); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:16px; z-index:5; display:grid; gap:8px}
.gcard h3{font-family:var(--serif); font-size:20px; margin:0; line-height:1.25}
.gcard p{margin:0; font-size:14px; color:var(--muted)}
.gcard .row{display:flex; gap:8px; flex-wrap:wrap}
.gzoom{position:absolute; right:max(16px, env(safe-area-inset-right,0px)); top:16px; display:grid; gap:4px; z-index:4}
.gzoom button{width:34px; height:34px; border:1px solid var(--line); background:var(--raised); border-radius:9px; cursor:pointer; color:var(--muted); font-size:16px}
.gpanel-toggle{display:none}
/* svg graph */
svg.graph{display:block; width:100%; height:100%; cursor:grab}
svg.graph.static{cursor:pointer}
svg.graph:active{cursor:grabbing}
.graph line.e{stroke:var(--edge); stroke-width:1.1; transition:stroke-opacity .15s, stroke .15s}
.graph line.e.sug{stroke:var(--edge-sug); stroke-dasharray:3 4}
.graph line.e.sug[data-kind="SEMANTIC_SIMILARITY"]{stroke-dasharray:1 3}
.graph line.e.hi{stroke:var(--accent); stroke-opacity:1; stroke-width:1.6}
.graph line.e.dim{stroke-opacity:.12}
.graph g.n{cursor:pointer}
.graph g.n circle{stroke:var(--bg); stroke-width:1.5; transition:opacity .15s}
.graph g.n.focus circle.core{stroke:var(--fg); stroke-width:2.2}
.graph g.n circle.halo{fill:none; stroke:var(--accent); stroke-width:1.5; opacity:0}
.graph g.n.sel circle.halo{opacity:1}
.graph g.n.match circle.halo{opacity:.9; stroke:var(--warn)}
.graph g.n text{font-family:var(--sans); font-size:11px; fill:var(--fg); paint-order:stroke; stroke:var(--bg); stroke-width:3px; stroke-linejoin:round; pointer-events:none; transition:opacity .15s}
.graph g.n.dim circle{opacity:.18} .graph g.n.dim text{opacity:0!important}
.graph g.n.focus text, .graph g.n.sel text{opacity:1!important; font-weight:600}
.graph g.n.hov text{opacity:0!important}
.gtip{position:absolute; z-index:5; width:max-content; max-width:260px; background:var(--raised); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:10px 12px; font-size:13px; pointer-events:none; opacity:0; transform:translateY(4px); transition:opacity .12s, transform .12s}
.gtip.on{opacity:1; transform:none}
.gtip .gt-meta{display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; color:var(--faint); font-size:12px}
.gtip .gt-t{display:inline-flex; align-items:center; gap:5px}
.gtip b{display:block; font-family:var(--serif); font-size:15px; font-weight:500; line-height:1.25; margin:4px 0 0; color:var(--fg)}
.gtip p{margin:6px 0 0; color:var(--muted); font-size:12.5px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
@media (prefers-reduced-motion: reduce){ .gtip{transition:none; transform:none} }
.graph .arrow{fill:var(--edge)}

/* ---------- Sign in ---------- */
.signin{max-width:400px; margin:64px auto; display:grid; gap:20px}
.signin h1{font-family:var(--serif); font-weight:500; font-size:34px; margin:0; letter-spacing:-.01em}
.signin .card{border:1px solid var(--line); border-radius:16px; background:var(--surface); padding:24px; display:grid; gap:12px}
.signin .btn{justify-content:center; height:42px; width:100%}
.or{display:flex; align-items:center; gap:12px; color:var(--faint); font-size:12px}
.or::before, .or::after{content:""; height:1px; background:var(--line); flex:1}
.field{display:grid; gap:6px; font-size:13px}
.field > span{color:var(--muted); font-weight:500}

/* ---------- Studio ---------- */
.studio{display:grid; grid-template-columns:220px minmax(0,1fr); gap:40px; padding-block:28px 72px}

.snav a:hover{background:var(--code-bg); color:var(--fg)}
.snav a[aria-current="page"]{background:var(--code-bg); color:var(--fg); font-weight:500}
.snav .who{margin-top:18px; padding:12px 10px; border-top:1px solid var(--line); font-size:12px; color:var(--faint); display:grid; gap:4px}
.s-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap}
.s-head h1{font-family:var(--serif); font-weight:500; font-size:30px; margin:0; letter-spacing:-.01em}
.s-head p{margin:4px 0 0; color:var(--muted); font-size:14px}
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface)}
table.tbl{width:100%; border-collapse:collapse; font-size:14px; min-width:640px}
.tbl th{text-align:left; font-weight:500; font-size:12px; color:var(--faint); padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap}
.tbl td{padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.t-title a{text-decoration:none; font-weight:500} .tbl td.t-title a:hover{text-decoration:underline}
.tbl .sub{font-family:var(--mono); font-size:12px; color:var(--faint)}
.tbl .acts{display:flex; gap:6px; justify-content:flex-end}
.confirm-row td{background:var(--warn-soft)}
.confirm-row .cr{display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.filters{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap}
.filters button{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 12px; font-size:13px; cursor:pointer; color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.src-grid{display:grid; gap:14px}
.src{border:1px solid var(--line); border-radius:14px; background:var(--surface); padding:18px; display:grid; gap:14px}
.src-top{display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap}
.prov{width:38px; height:38px; border-radius:10px; display:grid; place-items:center; background:var(--code-bg); font-family:var(--mono); font-size:11px; font-weight:500; color:var(--muted); flex:none}
.src h3{margin:0; font-size:16px; font-weight:600}
.src .path{font-family:var(--mono); font-size:12.5px; color:var(--muted)}
.src-meta{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; font-size:13px}
.src-meta dt{color:var(--faint); font-size:12px; margin-bottom:2px}
.src-meta dd{margin:0; font-weight:500; overflow-wrap:anywhere}
.src-acts{display:flex; gap:8px; flex-wrap:wrap; margin-left:auto}
.notice{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:10px; font-size:13px; background:var(--warn-soft); color:var(--warn)}
.notice.err{background:var(--err-soft); color:var(--err)}
.notice.info{background:var(--accent-soft); color:var(--accent)}
.stackbar{display:flex; height:6px; border-radius:3px; overflow:hidden; background:var(--code-bg); width:120px}
.stackbar i{display:block; height:100%}
.counts{font-size:12px; color:var(--faint); margin-top:4px}
.run-summary{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:22px}
.run-summary div{background:var(--surface); padding:14px 16px}
.run-summary dt{font-size:12px; color:var(--faint)}
.run-summary dd{margin:4px 0 0; font-size:22px; font-family:var(--serif); font-weight:500}
.pipeline{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:8px 0 26px; counter-reset:p}
.pipeline span{font-family:var(--mono); font-size:12px; background:var(--code-bg); border-radius:6px; padding:4px 8px; counter-increment:p}
.pipeline span::before{content:counter(p) " "; color:var(--faint)}
.pipeline i{color:var(--faint); font-style:normal; font-size:12px}
.sev{font-family:var(--mono); font-size:11px; font-weight:500; padding:2px 6px; border-radius:4px}
.sev.ERROR{background:var(--err-soft); color:var(--err)} .sev.WARNING{background:var(--warn-soft); color:var(--warn)} .sev.INFO{background:var(--code-bg); color:var(--muted)}
.role-toggle{display:inline-flex; gap:6px}
.role-toggle button{border:1px solid var(--line-strong); background:none; border-radius:999px; padding:2px 10px; font-size:12px; cursor:pointer; color:var(--muted)}
.role-toggle button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent); border-color:transparent; font-weight:500}
.tbl select{height:30px; border:1px solid var(--line); border-radius:7px; background:var(--surface); padding:0 8px; font-size:13px; max-width:180px}
dialog.drawer{margin:0 0 0 auto; height:100%; max-height:100%; width:min(480px, 100%); border:0; border-left:1px solid var(--line); background:var(--surface); color:var(--fg); padding:0; box-shadow:var(--shadow)}
dialog.drawer::backdrop{background:rgba(10,12,16,.35)}
.drawer form{display:flex; flex-direction:column; height:100%}
.drawer .d-head{padding:20px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center}
.drawer .d-head h2{margin:0; font-family:var(--serif); font-weight:500; font-size:24px}
.drawer .d-body{padding:20px 24px; display:grid; gap:16px; overflow:auto; flex:1; align-content:start}
.drawer .d-foot{padding:16px 24px calc(16px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px}
.cols2{display:grid; grid-template-columns:1fr 1fr; gap:12px}

/* ---------- Prototype panel ---------- */
.proto-fab{position:fixed; left:max(16px, env(safe-area-inset-left,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:90; height:34px; padding:0 14px 0 10px; border-radius:999px; border:1px dashed var(--line-strong); background:var(--raised); color:var(--muted); display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; box-shadow:var(--shadow)}
.proto-fab b{font-family:var(--mono); font-size:11px; font-weight:500; background:var(--code-bg); border-radius:4px; padding:1px 6px}
.proto{position:fixed; left:max(16px, env(safe-area-inset-left,0px)); bottom:calc(60px + env(safe-area-inset-bottom,0px)); z-index:90; width:340px; max-width:calc(100vw - 32px); max-height:calc(100dvh - 140px); overflow:auto; background:var(--raised); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow)}
.proto section{padding:12px 14px; border-bottom:1px solid var(--line); display:grid; gap:8px}
.proto h2{font-size:13px; margin:0; display:flex; justify-content:space-between; align-items:center}
.proto label.f{display:grid; gap:4px; font-size:12px; color:var(--muted)}
.proto select{height:30px; border:1px solid var(--line); border-radius:7px; background:var(--surface); padding:0 8px; font-size:13px}
.netlog{font-family:var(--mono); font-size:11px; display:grid; gap:2px; max-height:180px; overflow:auto}
.netlog div{display:grid; grid-template-columns:38px 30px 1fr 40px; gap:6px; color:var(--muted)}
.netlog .st2{color:var(--ok)} .netlog .st4{color:var(--warn)} .netlog .st5{color:var(--err)}
.netlog .path{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.toasts{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(24px + env(safe-area-inset-bottom,0px)); z-index:95; display:grid; gap:8px; justify-items:center}
.toast{background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:14px; box-shadow:var(--shadow); display:flex; gap:12px; align-items:center}
.toast.err{background:var(--err); color:#fff}

/* ---------- Responsive ---------- */
@media (max-width:1180px){ .article-shell{grid-template-columns:minmax(0, var(--col)) 260px; gap:40px} .toc{display:none} }
@media (max-width:960px){
  .home{grid-template-columns:minmax(0,1fr); gap:36px} .rail{position:static}
  .article-shell{grid-template-columns:minmax(0, var(--col))} .side{position:static; order:2}
  .studio{grid-template-columns:minmax(0,1fr); gap:20px}
  .snav{position:static; display:flex; overflow-x:auto; gap:4px; padding-bottom:4px}
  .snav .eyebrow, .snav .who{display:none} .snav a{white-space:nowrap}
  .src-meta, .run-summary{grid-template-columns:repeat(2, minmax(0,1fr))}
  .nav{display:none}
}
@media (max-width:640px){
  .search{max-width:none} .search kbd{display:none}
  .brand span{display:none}
  .hero-graph .hg-copy{position:static; padding:18px 18px 0; max-width:none}
  .hero-graph .gcanvas{height:240px}
  .gpanel{display:none; width:auto; right:max(16px, env(safe-area-inset-right,0px)); top:auto; bottom:calc(64px + env(safe-area-inset-bottom,0px)); max-height:60%}
  .gpanel.open{display:block}
  .gpanel-toggle{display:inline-flex; position:absolute; left:max(16px, env(safe-area-inset-left,0px)); top:16px; z-index:6}
  .gbanner{top:62px; max-width:calc(100% - 32px)}
  .gcard{left:max(16px, env(safe-area-inset-left,0px)); width:auto}
  .pn{grid-template-columns:1fr}
  .dek{font-size:19px} :root{--read-size:18.5px} :root[data-reading="on"]{--read-size:20px}
  .cols2{grid-template-columns:1fr}
  .proto-fab span{display:none}
}

<script>
"use strict";
/* =====================================================================
   1. MOCK CONTENT
   Authored in a compact Markdown-ish form, then converted by toBlocks()
   into the exact ContentBlock / InlineContent tree from apim/api-spec.yaml
   (discriminators: paragraph, heading, code, list, quote, table,
   thematicBreak / text, styled, code, internalLink, externalLink, image, break).
   ===================================================================== */
const TOPICS = [
  {key:"ds",  slug:"distributed-systems", name:"Distributed Systems", description:"Consensus, replication, time and failure in systems that span machines."},

  summary:"Leader election gets the attention, but Raft is really a protocol for agreeing on a log. Follow one entry from client request to commit.",
  body:`Most explanations of Raft start with elections. That is the dramatic part, but it is not what Raft is *for*. Raft exists to make a group of machines agree on the contents of an ordered log. Everything else, including [[leader-election|leader election]], serves that goal.

## The life of one entry

A client sends a command to the leader. The leader appends it to its own log, then sends \`AppendEntries\` to every follower. Once a **majority** has written the entry durably, the leader marks it committed and applies it to its state machine.

1. Leader appends the entry at index *n* in term *t*.
2. Followers check that their entry at *n − 1* matches, then append.
3. A majority acknowledges, so the entry is committed.
4. The leader advances \`commitIndex\` and followers learn it on the next heartbeat.

Durability on each node comes from a [[write-ahead-log|write-ahead log]]. If a follower acknowledges before \`fsync\`, the majority guarantee is fiction.

\`\`\`go
func (r *Raft) handleAppendEntries(req AppendEntriesRequest) AppendEntriesResponse {
    if req.Term < r.currentTerm {
        return AppendEntriesResponse{Term: r.currentTerm, Success: false}
    }
    if !r.log.matches(req.PrevLogIndex, req.PrevLogTerm) {
        return AppendEntriesResponse{Term: r.currentTerm, Success: false}
    }
    r.log.appendFrom(req.PrevLogIndex+1, req.Entries)
    r.log.sync() // durable before we say yes
    return AppendEntriesResponse{Term: r.currentTerm, Success: true}
}
\`\`\`

## What a majority buys you

| Cluster size | Majority | Failures tolerated |
|---|:-:|:-:|
| 3 | 2 | 1 |
| 5 | 3 | 2 |
| 7 | 4 | 3 |

Adding nodes past five rarely helps. Each write waits for more acknowledgements, and [[tail-latency|tail latency]] grows with the slowest member of the majority.

> A committed entry is never lost, as long as a majority of the cluster survives with its disk intact.

## Where it connects

Reads are the subtle part. A leader that serves reads from memory can return stale data after a partition, which breaks [[linearizability]]. The fix is a read index or leader leases, both of which depend on bounded [[clock-skew|clock skew]].

Raft is often compared with [[Multi-Paxos]]. The two are close relatives, and the comparison deserves its own article.

---

## Two retrievers

- [[postgres-fts|Full-text search]] ranks by term frequency with \`ts_rank_cd\`. Scores are unbounded above.
- [[pgvector-hnsw|Vector search]] ranks by cosine similarity. Scores sit between −1 and 1, and most real results bunch between 0.6 and 0.9.

Adding those two numbers lets whichever scale is larger dominate. Normalise each to 0..1 within the result set first.

\`\`\`sql
WITH lexical AS (
  SELECT id, ts_rank_cd(search_vector, query) AS score
  FROM documents, plainto_tsquery('english', :q) query
  WHERE search_vector @@ query
), semantic AS (
  SELECT id, 1 - (embedding <=> :embedding) AS score
  FROM documents
  ORDER BY embedding <=> :embedding
  LIMIT 50
)
SELECT id,
       0.6 * coalesce(l.score / max(l.score) OVER (), 0)
     + 0.4 * coalesce(s.score, 0) AS combined
FROM lexical l FULL JOIN semantic s USING (id)
ORDER BY combined DESC;
\`\`\`

  summary:"The authorization code flow with PKCE is the default for browser apps. What each step protects against, and where the tokens end up.",
  body:`A web app should never see a user's password. It sends the user to an identity provider, gets back a short-lived code, and exchanges that code for tokens. **PKCE** makes the exchange safe even when the client can't keep a secret.

## The flow

1. The app generates a random \`code_verifier\` and sends its SHA-256 hash as \`code_challenge\`.
2. The provider authenticates the user and redirects back with a one-time \`code\`.
3. The app exchanges the code plus the original verifier for tokens.
4. The API validates each access token against the provider's keys, see [[jwt-validation|JWT validation]].

An attacker who intercepts the code can't use it without the verifier.

## Where the tokens live

Keep tokens out of \`localStorage\`, where any injected script can read them. With a server-rendered frontend, store the session in [[secure-cookies|httpOnly cookies]] and attach the bearer token on the server side.

| Storage | Readable by page JS | Sent automatically | Verdict |
|---|:-:|:-:|---|
| localStorage | Yes | No | Avoid |
| Memory only | Yes | No | OK for SPAs, lost on reload |
| httpOnly cookie | No | Yes | Preferred with a server |

## Roles don't belong in the token

Providers often let users edit their own metadata. If the API derives permissions from claims the user controls, anyone can grant themselves anything. Use the token to prove *who* the caller is, then look up what they may do in your own records.

Signing webhooks follows the same idea of verifying what crosses a boundary, see [[webhook-signatures|webhook signatures]].`},

    edges = data.edges.filter(e=>ids.has(e.sourceId)&&ids.has(e.targetId) && (o.suggested!==false || e.authored)).map(e=>({...e, source:e.sourceId, target:e.targetId}));
    const deg=new Map(); edges.forEach(e=>{ deg.set(e.sourceId,(deg.get(e.sourceId)||0)+1); deg.set(e.targetId,(deg.get(e.targetId)||0)+1); });
    nodes.forEach(n=>{ n.deg=deg.get(n.id)||0; n.r=(o.mini?3.5:4.5)+Math.sqrt(n.count||n.deg)*(o.mini?1.6:2.3) + (n.id===o.focusId?3:0); });
    if(o.focusId){ const f=nodes.find(n=>n.id===o.focusId); if(f && !posCache.has(f.id)){ f.fx=0; f.fy=0; setTimeout(()=>{ f.fx=null; f.fy=null; }, 600); } }
    const eSel = gE.selectAll("line").data(edges, e=>e.sourceId+">"+e.targetId);
    eSel.exit().remove();
    eSel.enter().append("line").merge(eSel).attr("class", e=>"e"+(e.authored?"":" sug")).attr("data-kind", e=>e.kind).attr("marker-end", o.arrows?`url(#${arrId})`:null);
    const nSel = gN.selectAll("g.n").data(nodes, n=>n.id);
    nSel.exit().remove();
    const nEnter = nSel.enter().append("g").attr("class","n").attr("tabindex", o.mini?-1:0).attr("data-testid","graph-node").attr("data-slug", n=>n.slug);
    nEnter.append("circle").attr("class","halo"); nEnter.append("circle").attr("class","core"); nEnter.append("text").attr("dy", "0.32em");
    if(!tip) nEnter.append("title");
    const all = nEnter.merge(nSel);
    all.classed("focus", n=>n.id===o.focusId);
    all.select("circle.core").attr("r", n=>n.r).style("fill", n=>n.kind==="tag"?"var(--muted)":`var(--t-${topicOf(n.topic).key})`);
    all.select("circle.halo").attr("r", n=>n.r+4);
    all.select("text").text(n=>n.title.length>(o.mini?26:38)?n.title.slice(0,o.mini?24:36)+"…":n.title).attr("x", n=>n.r+5);
    all.attr("aria-label", n=>n.title); if(!tip) all.select("title").text(n=>n.count!=null?`${n.title} · ${n.count} ${n.count===1?"article":"articles"}`:n.title);
    all.on("mouseenter", (e,n)=>{ hoverId=n.id; highlight(); showTip(n); }).on("mouseleave", ()=>{ hoverId=null; highlight(); hideTip(); })
       .on("focus", (e,n)=>{ hoverId=n.id; highlight(); showTip(n); }).on("blur", ()=>{ hoverId=null; highlight(); hideTip(); })
       .on("click", (e,n)=>{ e.stopPropagation(); if(o.mini){ o.onOpen&&o.onOpen(n); return; } selId = selId===n.id?null:n.id; highlight(); o.onSelect&&o.onSelect(selId?n:null); })
       .on("dblclick", (e,n)=>{ e.stopPropagation(); o.onOpen&&o.onOpen(n); })
       .on("keydown", (e,n)=>{ if(e.key==="Enter"){ o.onOpen&&o.onOpen(n); } if(e.key===" "){ e.preventDefault(); selId=n.id; highlight(); o.onSelect&&o.onSelect(n); } });
    all.call(d3.drag().on("start",(e,d)=>{ hideTip(); if(!e.active) sim.alphaTarget(.25).restart(); d.fx=d.x; d.fy=d.y; }).on("drag",(e,d)=>{ d.fx=e.x; d.fy=e.y; }).on("end",(e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));
    sim.nodes(nodes); sim.force("link").links(edges).distance(e=>(o.mini?.6:1)*o.linkDistance*(e.authored?1:1.4)).strength(e=>e.authored?.5:.15);
    sim.force("charge").strength(o.mini?o.charge*.55:o.charge);
    if(reduce){ sim.stop(); sim.alpha(1); for(let i=0;i<300;i++) sim.tick(); draw(); } else sim.alpha(posCache.size?.4:1).restart();
    highlight(); labelVis();
  }
  function draw(){
    gE.selectAll("line").attr("x1",e=>e.source.x).attr("y1",e=>e.source.y).attr("x2",e=>e.target.x).attr("y2",e=>e.target.y);
    gN.selectAll("g.n").attr("transform", n=>`translate(${n.x},${n.y})`);
    nodes.forEach(n=>posCache.set(n.id,{x:n.x,y:n.y}));
  }
  function neighbours(id){ const s=new Set([id]); edges.forEach(e=>{ const a=e.source.id||e.source, b=e.target.id||e.target; if(a===id) s.add(b); if(b===id) s.add(a); }); return s; }
  function highlight(){
    const act = hoverId || selId; const nb = act?neighbours(act):null; const f=(o.filter||"").toLowerCase().trim();
    gN.selectAll("g.n").classed("hov", n=>!!tip && n.id===hoverId && o.labels!=="always").classed("hi", n=>!!nb && nb.has(n.id)).classed("dim", n=>(!!nb && !nb.has(n.id)) || (!!f && !nb && !n.title.toLowerCase().includes(f))).classed("sel", n=>n.id===selId).classed("match", n=>!!f && n.title.toLowerCase().includes(f));
    gE.selectAll("line").classed("hi", e=>!!act && ((e.source.id||e.source)===act || (e.target.id||e.target)===act)).classed("dim", e=>(!!act && (e.source.id||e.source)!==act && (e.target.id||e.target)!==act) || (!!f && !act));
    labelVis();
  }
  function labelVis(){
    const always=o.labels==="always";
    gN.selectAll("g.n text").style("opacity", n=>{ if(always) return 1; if(o.mini) return (n.id===o.focusId)?1:0; return k>=1.8?1:Math.max(0,(k-1.4)*2.5); });
  }
  svg.on("click", ()=>{ if(selId){ selId=null; highlight(); o.onSelect&&o.onSelect(null); } });
  const ro = new ResizeObserver(()=>{ const w=el.clientWidth, h=el.clientHeight; if(w&&h&&(w!==W||h!==H)){ W=w; H=h; svg.attr("viewBox",null); center(); } }); ro.observe(el);
  center(); build();
  return {
    update(next){ Object.assign(o, next); if(next.data) data=next.data; build(); },
    setFilter(f){ o.filter=f; highlight(); },
    select(id){ selId=id; highlight(); const n=nodes.find(x=>x.id===id); if(n){ svg.transition().duration(reduce?0:450).call(zoom.transform, d3.zoomIdentity.translate(W/2-n.x*1.6, H/2-n.y*1.6).scale(1.6)); } o.onSelect&&o.onSelect(n||null); },
    zoomBy(f){ svg.transition().duration(reduce?0:200).call(zoom.scaleBy, f); },
    reset(){ selId=null; highlight(); svg.transition().duration(reduce?0:300).call(zoom.transform, d3.zoomIdentity.translate(W/2,H/2)); o.onSelect&&o.onSelect(null); },
    destroy(){ sim.stop(); ro.disconnect(); svg.remove(); tip&&tip.remove(); },
    get count(){ return {nodes:nodes.length, edges:edges.length}; }
  };
}

const mq = matchMedia("(prefers-color-scheme: dark)");
const effTheme = () => document.documentElement.dataset.theme || (mq.matches?"dark":"light");
function applyTheme(t, persist=true){
  document.documentElement.dataset.theme=t; if(persist) store.set("theme", t);
  if(t==="dark") setReading(false, false);
  syncThemeUI();
}
function setReading(on, persist=true){
  if(on && effTheme()!=="light") on=false;
  if(on) document.documentElement.dataset.reading="on"; else delete document.documentElement.dataset.reading;
  if(persist) store.set("reading", on);
  syncThemeUI();
}
function syncThemeUI(){
  const t=effTheme(), r=document.documentElement.dataset.reading==="on";
  $("#themeIcon").innerHTML = t==="dark"?ICON.sun:ICON.moon;
  $("#themeLabel").textContent = t==="dark"?"Switch to light theme":"Switch to dark theme";
  $("#themeBtn").title = t==="dark"?"Switch to light theme":"Switch to dark theme";
  $("#readingBtn").hidden = t!=="light";
  $("#readingBtn").setAttribute("aria-pressed", String(r));
  $("#readingBtn").title = r?"Turn off reading mode":"Turn on reading mode";
  const ex=$("#exitReading"); if(ex) ex.hidden=!r;
}
mq.addEventListener("change", ()=>{ if(!document.documentElement.dataset.theme) syncThemeUI(); if(effTheme()==="dark") setReading(false,false); });

const state = { q:"", understand:true, homeTopic:null, homePage:0 };
let sugIdx=-1, sugItems=[], sugTimer;
function closeSuggest(){ $("#suggest").hidden=true; $("#q").setAttribute("aria-expanded","false"); sugIdx=-1; }
function drawSuggest(){
  const q=$("#q").value.trim(); const box=$("#suggest");
  if(!q){ closeSuggest(); return; }
  box.innerHTML = sugItems.map((s,i)=>`<button type="button" role="option" id="sg${i}" aria-selected="${i===sugIdx}" data-slug="${esc(s.slug)}" data-testid="suggest-item"><span class="dot" style="background:var(--t-${topicOf(s.topic).key})"></span><span class="s-t">${esc(s.title)}</span><span class="s-m">${esc(s.authorName)}</span></button>`).join("")
    + `<button type="button" role="option" id="sg${sugItems.length}" aria-selected="${sugIdx===sugItems.length}" data-all data-testid="suggest-all"><span class="s-all">Search for “${esc(q)}”</span></button>`;
  box.hidden=false; $("#q").setAttribute("aria-expanded","true"); $("#q").setAttribute("aria-activedescendant", sugIdx>=0?"sg"+sugIdx:"");
}
$("#q").addEventListener("input", ()=>{ clearTimeout(sugTimer); const q=$("#q").value.trim(); if(!q){ closeSuggest(); return; }
  sugTimer=setTimeout(async()=>{ try{ sugItems=await api("GET","/api/search/suggest",{query:{q, limit:6}}); }catch(e){ sugItems=[]; } sugIdx=-1; drawSuggest(); }, 160); });
$("#q").addEventListener("keydown", e=>{
  const n=sugItems.length+1;
  if(e.key==="ArrowDown"){ e.preventDefault(); sugIdx=(sugIdx+1)%n; drawSuggest(); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); sugIdx=(sugIdx-1+n)%n; drawSuggest(); }
  else if(e.key==="Escape"){ closeSuggest(); }
  else if(e.key==="Enter"){ e.preventDefault(); if(sugIdx>=0 && sugIdx<sugItems.length){ go("a-"+sugItems[sugIdx].slug); } else runSearch($("#q").value); closeSuggest(); }
});
$("#suggest").addEventListener("mousedown", e=>{ const b=e.target.closest("button"); if(!b) return; e.preventDefault(); if(b.dataset.all!==undefined) runSearch($("#q").value); else go("a-"+b.dataset.slug); closeSuggest(); });
$("#q").addEventListener("blur", ()=>setTimeout(closeSuggest,120));
document.addEventListener("keydown", e=>{ if(e.key==="/" && !/input|textarea|select/i.test(document.activeElement.tagName)){ e.preventDefault(); $("#q").focus(); } });
function runSearch(q){ q=(q||"").trim(); if(!q) return; state.q=q; $("#q").value=""; if(location.hash==="#search") router(); else go("search"); }
function go(h){ if(location.hash==="#"+h) router(); else location.hash=h; }

  cleanup.push(()=>g.destroy());
  const setCount=()=>$("#lgCount").textContent=`${g.count.nodes} notes · ${g.count.edges} links${gctx.truncated?" · partial":""}`; setCount();
  async function reloadGraph(){ try{ gctx=await api("GET","/api/graph",{query:{slug:a.slug, depth, includeSuggestions:$("#lgSug").checked}}); g.update({data:gctx, suggested:true}); setCount(); }catch(e){ toast("Couldn't load the graph. Try again.","err"); } }
  $$(".lg-head .seg button").forEach(b=>b.onclick=()=>{ depth=+b.dataset.depth; $$(".lg-head .seg button").forEach(x=>x.setAttribute("aria-pressed", String(x===b))); reloadGraph(); });
  $("#lgSug").onchange=reloadGraph;
  $("#exitReading").onclick=()=>setReading(false);
  $("#copyLink").onclick=async()=>{ try{ await navigator.clipboard.writeText(location.href); toast("Link copied"); }catch(e){ toast("Copy isn't available here. Use the address bar.","err"); } };
  $$("#prose [data-copy]").forEach(b=>b.onclick=async()=>{ try{ await navigator.clipboard.writeText(b.closest("pre").querySelector("code").textContent); b.textContent="Copied"; setTimeout(()=>b.textContent="Copy",1500); }catch(e){ b.textContent="Select manually"; } });
  $$(".toc a").forEach(l=>l.onclick=e=>{ e.preventDefault(); document.getElementById(l.dataset.anchor)?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); });
  // scrollspy + reading progress
  const hs=a.outline.map(h=>document.getElementById(h.anchorId)).filter(Boolean);
  const io=new IntersectionObserver(es=>{ es.forEach(en=>{ if(en.isIntersecting){ $$(".toc a").forEach(l=>l.classList.toggle("active", l.dataset.anchor===en.target.id)); } }); }, {rootMargin:"-20% 0px -70% 0px"});
  hs.forEach(h=>io.observe(h)); cleanup.push(()=>io.disconnect());
  const prog=$("#progress"); prog.hidden=false; const onScroll=()=>{ const el=$("#prose"); if(!el) return; const r=el.getBoundingClientRect(); const p=Math.min(1,Math.max(0,(innerHeight*.4-r.top)/r.height)); prog.style.width=(p*100)+"%"; };
  addEventListener("scroll", onScroll, {passive:true}); onScroll(); cleanup.push(()=>{ removeEventListener("scroll", onScroll); prog.hidden=true; document.title="Knowledge Platform Prototype"; });
  wirePreviews($("#prose"));
  api("POST",`/api/articles/${a.slug}/view`).catch(()=>{}); // fire-and-forget, failures never affect reading
}
// Hover previews for internal links (desktop pointer only)
const previewCache=new Map();
function wirePreviews(root){
  const pv=$("#preview"); let timer;
  const hide=()=>{ clearTimeout(timer); pv.hidden=true; };
  const place=(el)=>{ const r=el.getBoundingClientRect(); const top = r.bottom+10+180>innerHeight ? r.top-10-pv.offsetHeight : r.bottom+10; pv.style.top=Math.max(8,top)+"px"; pv.style.left=Math.min(innerWidth-pv.offsetWidth-16, Math.max(16, r.left))+"px"; };
  root.addEventListener("pointerover", e=>{
    const el=e.target.closest(".ilink"); if(!el || e.pointerType==="touch") return; clearTimeout(timer);
    timer=setTimeout(async()=>{
      if(el.classList.contains("unresolved")){ pv.innerHTML=`<b>${esc(el.dataset.ref)}</b><p>This article hasn't been written yet. The link will work automatically once it's published.</p>`; pv.hidden=false; place(el); return; }
      const s=el.dataset.slug; let d=previewCache.get(s);
      if(!d){ pv.innerHTML=`<div class="skel" style="height:18px; width:80%"></div>${skelLines(2)}`; pv.hidden=false; place(el); try{ d=await api("GET","/api/articles/"+s); previewCache.set(s,d); }catch(err){ pv.innerHTML=`<p>Preview unavailable.</p>`; return; } }
      pv.innerHTML=`<b>${esc(d.title)}</b><p>${esc(d.summary)}</p><small>${esc(d.author.displayName)} · ${d.readingTimeMinutes} min read · ${d.backlinks.length} backlinks</small>`; pv.hidden=false; place(el);
    }, 350);
  });
  root.addEventListener("pointerout", e=>{ if(e.target.closest(".ilink")) hide(); });
  cleanup.push(hide);
}

/* ---- Search ---- */
async function viewSearch(){
  const q=state.q;
  mount(`<div class="search-page" data-testid="view-search">
    <form class="sp-box" id="spForm" role="search"><label for="spq" class="sr-only">Search</label><input id="spq" value="${esc(q)}" placeholder="Search the knowledge base" data-testid="search-input" autocomplete="off"><button class="btn primary" data-testid="search-submit">Search</button></form>
    <div class="sp-opts"><label class="toggle"><input type="checkbox" id="spU" ${state.understand?"checked":""} data-testid="search-understand"> Interpret my question with AI</label><span class="faint">Try “raft by Maya since 2025” or “security articles this year”</span></div>
    <div id="spOut">${q?skelLines(6):`<div class="state" style="margin-top:48px"><h2>Search by idea, not only by keyword</h2><p>Ask in plain language. You'll see how the query was understood and why each result matched.</p></div>`}</div></div>`);
  $("#spForm").onsubmit=e=>{ e.preventDefault(); state.q=$("#spq").value.trim(); if(state.q) viewSearch(); };
  $("#spU").onchange=()=>{ state.understand=$("#spU").checked; if(state.q) viewSearch(); };
  if(!q){ $("#spq").focus(); return; }
  const my=++token; let r;
  try{ r=await api("GET","/api/search",{query:{q, understand:state.understand, page:0, size:10}}); }catch(e){ if(my===token){ $("#spOut").innerHTML=errorState(e); $("#retryBtn")&&($("#retryBtn").onclick=viewSearch); } return; }
  if(my!==token) return;
  const I=r.interpretation, terms=(I.queryText||"").split(" ").filter(w=>w.length>2);
  const mark = s => { let h=esc(s); terms.forEach(t=>{ h=h.replace(new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})`,"gi"),"<mark>$1</mark>"); }); return h; };
  const hasInterp = r.usedQueryUnderstanding && (I.author||I.topics.length||I.tags.length||I.publishedAfter);
  const interpHtml = !proto.ai
    ? `<div class="interp off" data-testid="interp-off"><div class="interp-row"><span class="pill warn">Keyword search only</span><span class="muted">The AI model isn't available right now, so results match your exact words. Semantic matches are missing.</span></div></div>`
    : r.usedQueryUnderstanding
      ? `<div class="interp" data-testid="interpretation"><div class="interp-row"><span class="k">Understood as</span>${I.queryText?`<span class="chip">“${esc(I.queryText)}”</span>`:""}${I.author?`<span class="chip">${I.authorResolved?"by "+esc(I.author):"author “"+esc(I.author)+"” not found"}</span>`:""}${I.topics.map(x=>`<span class="chip"><span class="dot" style="background:var(--t-${topicOf(x).key})"></span>${esc(x)}</span>`).join("")}${I.tags.map(x=>`<span class="chip">#${esc(x)}</span>`).join("")}${I.publishedAfter?`<span class="chip">after ${fmtDate(I.publishedAfter)}</span>`:""}${!hasInterp?`<span class="muted">no filters detected</span>`:""}</div></div>`
      : `<div class="interp off" data-testid="interp-skipped"><div class="interp-row"><span class="muted">${state.understand?"Short query, searched directly without AI interpretation.":"AI interpretation is off. Searching your exact words and similar ideas."}</span></div></div>`;
  $("#spOut").innerHTML = interpHtml + `<div class="faint" style="font-size:13px; margin-top:14px" data-testid="search-meta"><span class="tabular">${r.totalResults}</span> ${r.totalResults===1?"result":"results"} · ${r.mode.toLowerCase()} · <span class="tabular">${r.tookMillis}</span> ms</div>
   <div class="hits" data-testid="search-results">${r.results.length? r.results.map(h=>{ const x=h.explanation; const rows=[["Keyword match",x.lexical],["Meaning match",x.semantic],["Author",x.authorMatch],["Topic",x.topicMatch],["Tag",x.tagMatch],["Recency",x.recency]];
     return `<div class="hit" data-testid="search-hit" data-slug="${h.slug}"><div class="post-by">${avatar(h.authorName,h.authorSlug)}<span>${esc(h.authorName)}</span>${h.topics.map(topicChip).join("")}</div><h3><a href="#a-${h.slug}">${mark(h.title)}</a></h3><p>${mark(h.summary)}</p>
      <div class="post-meta"><span>${fmtShort(h.publishedAt)}</span><span>${h.readingTimeMinutes} min read</span></div>
      <details class="why" data-testid="why-result"><summary>Why this result <span class="score">${h.score.toFixed(2)}</span></summary><div class="why-grid">${rows.map(([l,v])=>`<span class="muted">${l}</span><span class="bar"><i style="width:${Math.round(v*100)}%"></i></span><span class="score">${(+v).toFixed(2)}</span>`).join("")}</div><div class="faint" style="margin-top:8px">Matched by ${x.matchedBy.join(", ")||"—"}</div></details></div>`; }).join("")
     : `<div class="state" data-testid="search-empty"><h2>No results for “${esc(q)}”</h2><p>Try fewer words, or turn on AI interpretation to match related ideas.${I.author&&!I.authorResolved?` No author named “${esc(I.author)}” exists.`:""}</p></div>`}</div>`;
}

const gx = { scope:"all", focus:null, focusArticle:null, withTags:true, depth:1, maxNodes:40, suggested:true, arrows:false, labels:false, dist:130, charge:-360, topics:new Set(TOPICS.map(t=>t.key)), filter:"" };
async function viewGraph(focusSlug){
  if(focusSlug){ gx.scope="local"; gx.focusArticle=focusSlug; }

  const arts = await load(()=>api("GET","/api/articles",{query:{page:0,size:200}})); if(!arts) return;

  const termMap=new Map(); arts.content.forEach(a=>{ (a._meta.topics||[a._meta.topic]).forEach(t=>termMap.set("topic:"+t.slug,{id:"topic:"+t.slug, label:t.name, kind:"topic"})); a._meta.tags.forEach(t=>termMap.set("tag:"+tagSlug(t),{id:"tag:"+tagSlug(t), label:"#"+t, kind:"tag"})); });
  const terms=[...termMap.values()].sort((x,y)=>x.label.localeCompare(y.label));

  mount(`<div class="explorer" data-testid="view-graph" style="margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)))">

      <section><p class="faint" id="gTaxLegend" style="font-size:12px; margin:0" ${gx.scope==="local"?"":"hidden"}>A line means the two share at least one article. Bigger dots have more articles; grey dots are tags.</p><div id="gArtOpts" style="display:grid; gap:10px" ${gx.scope==="all"?"":"hidden"}><label class="toggle"><input type="checkbox" id="gSug" ${gx.suggested?"checked":""} data-testid="graph-suggested"> Suggested links</label><label class="toggle"><input type="checkbox" id="gArr" ${gx.arrows?"checked":""}> Arrows</label><label class="toggle"><input type="checkbox" id="gLab" ${gx.labels?"checked":""}> Always show labels</label>

    c.hidden=false; $("#gcFocus").onclick=()=>centreOn("topic:"+(a?._meta.topic.slug||topicOf(n.topic).slug)); }
  function syncScope(){ $("#gTaxLegend").hidden=gx.scope!=="local"; $("#gArtOpts").hidden=gx.scope!=="all"; $$("[data-scope]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.scope===gx.scope))); $("#gScopeAll").hidden=gx.scope!=="all"; $("#gScopeLocal").hidden=gx.scope!=="local"; }

  $("#gFilter").onkeydown=e=>{ if(e.key==="Enter"){ const f=gx.filter.toLowerCase().trim(); const n=f && $$("#bigGraph g.n").find(x=>d3.select(x).datum().title.toLowerCase().includes(f)); if(n) g.select(d3.select(n).datum().id); } };
  $$("[data-tk]").forEach(c=>c.onchange=()=>{ c.checked?gx.topics.add(c.dataset.tk):gx.topics.delete(c.dataset.tk); g.update({topics:gx.topics}); });

    setRole(id, ro, !on); });
  async function setRole(id, ro, grant){ try{ await api(grant?"PUT":"DELETE",`/api/studio/accounts/${id}/roles/${ro}`); toast(grant?`${ro[0]+ro.slice(1).toLowerCase()} role granted`:`${ro[0]+ro.slice(1).toLowerCase()} role removed`); renderAccount(); router(); }catch(e){ toast(e.body?.detail||"Couldn't change the role.","err"); } }
  $$("[data-link]").forEach(s=>s.onchange=async()=>{ const id=s.closest("tr").dataset.id; try{ await (s.value? api("PUT",`/api/studio/accounts/${id}/author`,{body:{authorId:s.value}}) : api("DELETE",`/api/studio/accounts/${id}/author`)); toast(s.value?"Byline linked":"Byline unlinked"); }catch(e){ toast(e.body?.detail||"Couldn't link the byline.","err"); viewAccounts(); } });
}

/* =====================================================================
   12. ROUTER (plain #name hashes only, per the artifact frame rules)
   ===================================================================== */
function router(){
  const h=(location.hash||"#home").slice(1); let m;
  $$(".nav a").forEach(a=>a.toggleAttribute("aria-current", false)); const top=h.startsWith("graph")?"graph":(h==="home"||h.startsWith("a-")?"home":""); const na=$(`.nav a[data-nav="${top}"]`); na&&na.setAttribute("aria-current","page");
  if(h!=="search") closeSuggest();
  document.documentElement.dataset.view = h.startsWith("a-") ? "article" : "other"; // reading mode hides chrome on articles only
  window.scrollTo(0,0); $("#preview").hidden=true;
  if(h==="home") return viewHome();
  if(h==="graph") return viewGraph(null);
  if((m=h.match(/^graph-(.+)$/))) return viewGraph(m[1]);
  if(h==="search") return viewSearch();
  if((m=h.match(/^a-(.+)$/))) return viewArticle(m[1]);
  if((m=h.match(/^(topic|tag|author)-(.+)$/))) return viewList(m[1], m[2]);
  if(h==="signin") return viewSignin();
  if(h==="studio") return viewStudioArticles();
  if(h==="studio-sources") return viewSources();
  if(h==="studio-runs") return viewRuns();
  if((m=h.match(/^run-(.+)$/))) return viewRun(m[1]);
  if(h==="studio-accounts") return viewAccounts();
  mount(errorState(new ApiError(404,{title:"Not Found"})));
}
addEventListener("hashchange", router);

/* =====================================================================
   13. PROTOTYPE PANEL
   ===================================================================== */
function renderProto(){
  const p=$("#proto"); const o=(v,l,cur)=>`<option value="${v}" ${String(cur)===String(v)?"selected":""}>${l}</option>`;
  p.innerHTML=`<section><h2>Prototype controls <button class="btn sm ghost" id="pClose">Close</button></h2><p class="faint" style="margin:0; font-size:12px">Mock data follows apim/api-spec.yaml. Nothing here calls a real server.</p></section>
   <section><label class="f">Current user<select id="pPersona" data-testid="proto-persona">${Object.entries(PERSONAS).map(([k,v])=>o(k,v.label,proto.persona)).join("")}</select></label>
     <label class="f">Sign-in completes as<select id="pSignAs" data-testid="proto-signin-as">${["pending","author","admin"].map(k=>o(k,PERSONAS[k].label,proto.signInAs)).join("")}</select></label></section>
   <section><label class="f">Network latency<select id="pLat" data-testid="proto-latency">${o(0,"Instant",proto.latency)}${o(300,"Realistic (~300 ms)",proto.latency)}${o(1500,"Slow (~1.5 s)",proto.latency)}</select></label>
     <label class="f">Simulate failure<select id="pFail" data-testid="proto-fail">${o("none","None",proto.fail)}${o("next","Next request returns 500",proto.fail)}${o("reader","Reader API returns 500",proto.fail)}${o("studio","Studio API returns 500",proto.fail)}</select></label>
     <label class="toggle"><input type="checkbox" id="pAi" ${proto.ai?"checked":""} data-testid="proto-ai"> AI model available</label>
     <label class="toggle"><input type="checkbox" id="pEmpty" ${proto.empty?"checked":""} data-testid="proto-empty"> Empty knowledge base</label>
     <button class="btn sm" id="pReset" data-testid="proto-reset">Reset mock data</button></section>
   <section><h2>Requests <span class="faint" style="font-weight:400">last ${Math.min(proto.log.length,40)}</span></h2><div class="netlog" id="netlog" data-testid="proto-netlog"></div></section>`;
  renderNetlog();
  $("#pClose").onclick=toggleProto;
  $("#pPersona").onchange=e=>{ proto.persona=e.target.value; renderAccount(); router(); };
  $("#pSignAs").onchange=e=>{ proto.signInAs=e.target.value; };
  $("#pLat").onchange=e=>{ proto.latency=+e.target.value; };
  $("#pFail").onchange=e=>{ proto.fail=e.target.value; failNext = proto.fail==="next"; };
  $("#pAi").onchange=e=>{ proto.ai=e.target.checked; if(location.hash==="#search") router(); };
  $("#pEmpty").onchange=e=>{ proto.empty=e.target.checked; previewCache.clear(); router(); };
  $("#pReset").onclick=()=>{ buildDB(); previewCache.clear(); proto.log=[]; renderAccount(); router(); toast("Mock data reset"); };
}
function renderNetlog(){ const n=$("#netlog"); if(!n) return; n.innerHTML = proto.log.length? proto.log.map(e=>`<div><span>${e.method}</span><span class="st${String(e.status)[0]}">${e.status||"…"}</span><span class="path" title="${esc(e.path)}">${esc(e.path)}</span><span style="text-align:right">${e.ms}ms</span></div>`).join("") : `<span class="faint">No requests yet.</span>`; }
function toggleProto(){ const p=$("#proto"); p.hidden=!p.hidden; $("#protoFab").setAttribute("aria-expanded", String(!p.hidden)); if(!p.hidden) renderProto(); }
$("#protoFab").onclick=toggleProto;

/* =====================================================================
   14. BOOT
   ===================================================================== */
$("#themeBtn").onclick=()=>applyTheme(effTheme()==="dark"?"light":"dark");
$("#readingBtn").onclick=()=>setReading(document.documentElement.dataset.reading!=="on");
buildDB();
(function initTheme(){ const host=document.documentElement.dataset.theme; const saved=store.get("theme",null); if(!host && saved) document.documentElement.dataset.theme=saved; if(store.get("reading",false)) setReading(true,false); syncThemeUI(); })();
renderAccount();
if(!location.hash) history.replaceState(null,"","#home");
router();
</script>
